name: absensi_dede
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  logger: ^2.6.0  # for logging purpose
  json_annotation: ^4.9.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  dio: ^5.11.1
  retrofit: ^4.10.0
  flutter_hooks: ^0.21.3+1
  google_maps_flutter: ^2.18.1
  flutter_form_builder: ^11.0.0
  forui: ^0.27.1
  nav_bar: ^0.1.1
  # instal dulu go router deh baru buildernya
  go_router: ^18.0.1
  animated_text_kit: ^4.3.0
  google_fonts: ^8.2.1
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  hooks_riverpod: ^3.4.3
  form_builder_validators: ^11.3.0
  

dev_dependencies:
  retrofit_generator: ^10.0.1
  build_runner: ^2.6.0
  json_serializable: ^6.10.0
  go_router_builder: ^4.5.0
  riverpod_generator: ^4.0.9


  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  forui_cli: ^0.27.0

flutter:
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat.ttf
        - asset: assets/fonts/Montserrat/Montserrat-Italic.ttf
          style: italic
  uses-material-design: true

  assets:
    - assets/images/
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
